# 
name: 'NPM Custom Action'
description: 'Install NPM dependencies and run tests'
inputs:
  path:
    description: 'Path to the node_modules directory'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Cache npm dependences
      uses: actions/cache@v4
      with:
        path: ${{inputs.path}}
        key: ${{runner.os}}-node_modules-${{ hashFiles('package-lock.json') }}

    - name: Install Dependencies
      run: npm install
      shell: bash